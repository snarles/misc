[project]
name = "flies-and-goos"
version = "0.1.0"
description = "Flies and Goos: a 2-player codon game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flies_and_goos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
